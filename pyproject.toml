[project]
name = "kubernetes-crds"
version = "0.1.0"
description = "Kubernetes CRDs statistics"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "kubernetes>=37.0.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
